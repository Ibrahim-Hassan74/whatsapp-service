services:
  - type: web
    name: whatsapp-service
    runtime: node
    buildCommand: bash render-build.sh
    startCommand: node --max-old-space-size=256 index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      - key: SESSION_DATA_PATH
        value: /opt/render/project/src/sessions
      - key: PORT
        value: "5000"
      - key: ASP_NET_BASE_URL
        sync: false
      - key: NODE_TOKEN
        sync: false
      - key: SERVER_NAME
        value: NODE_WHATSAPP_SERVICE
    disk:
      name: whatsapp-sessions
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1
